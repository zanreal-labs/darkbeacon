<!doctype html>
<!-- Shown by the service worker (apps/web/src/pwa/sw-script.ts) when a page cannot be loaded at
     all. Self-contained: it is precached and must work with nothing else. Colours are the built-in
     light and dark themes (theme-sdk). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Offline · Darkbeacon</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8fa;
        --surface: #ffffff;
        --border: #e2e5ea;
        --text: #14171f;
        --muted: #596170;
        --accent: #0b7f91;
        --accent-hover: #096c7c;
        --accent-contrast: #ffffff;
        --ring: #14171f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0f14;
          --surface: #13161d;
          --border: #232833;
          --text: #e6e9ef;
          --muted: #9aa3b2;
          --accent: #38c6d6;
          --accent-hover: #5dd3e0;
          --accent-contrast: #041619;
          --ring: #e6e9ef;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.5 'Inter Variable',
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 12px;
        max-width: 360px;
        padding: 32px 24px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        text-align: center;
      }
      svg {
        width: 40px;
        height: 40px;
        margin-bottom: 4px;
      }
      .r {
        stroke: var(--ring);
      }
      .c {
        fill: var(--ring);
      }
      .b {
        fill: var(--accent);
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      button {
        margin-top: 8px;
        height: 32px;
        padding: 0 14px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: var(--accent-contrast);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-hover);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <mask id="gap" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36">
            <rect x="-6" y="-6" width="36" height="36" fill="#fff" />
            <path d="M 12.937 11.063 L 13.846 -0.043 A 13.35 13.35 0 0 1 24.043 10.154 Z" fill="#000" />
          </mask>
        </defs>
        <circle cx="11" cy="13" r="7.25" fill="none" stroke-width="1.75" class="r" mask="url(#gap)" />
        <circle cx="11" cy="13" r="3.25" class="c" />
        <path d="M 14.182 9.818 L 15.390 1.564 A 12.25 12.25 0 0 1 22.436 8.610 Z" class="b" />
      </svg>
      <h1>You're offline</h1>
      <p>Darkbeacon needs a connection to the map.</p>
      <button type="button" id="retry">Retry</button>
    </main>
    <script>
      // The address is the page that failed; loading it again is the retry. Also when the
      // connection comes back on its own.
      document.getElementById('retry').addEventListener('click', () => location.reload());
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
