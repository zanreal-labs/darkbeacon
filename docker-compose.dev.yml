# Development environment. Every Node command runs inside `dev`:
#   docker compose -f docker-compose.dev.yml run --rm dev pnpm test
# `app` runs the API (watch mode) and the Next.js dev server behind it, as in production: one
# public port (3000, published on a random loopback port), everything but /api and /ws proxied
# to `next dev` on 3001 inside the container (hot reload included).
#   docker compose -f docker-compose.dev.yml up app
#   docker compose -f docker-compose.dev.yml port app 3000
x-node: &node
  image: node:24-bookworm
  working_dir: /workspace
  init: true
  volumes:
    - .:/workspace
    - node_modules:/workspace/node_modules
    - pnpm_store:/pnpm-store
    - data:/data
  environment:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    npm_config_store_dir: /pnpm-store
    DATA_DIR: /data
    TEST_DATABASE_URL: postgres://darkbeacon:darkbeacon@postgres:5432/darkbeacon
    DEMO_MODE: 'true'
  entrypoint: ['sh', '-c', 'corepack enable pnpm >/dev/null 2>&1; exec "$$@"', '--']
  depends_on:
    postgres:
      condition: service_healthy

services:
  dev:
    <<: *node
    command: ['bash']

  app:
    <<: *node
    command: ['pnpm', 'dev']
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      npm_config_store_dir: /pnpm-store
      DATA_DIR: /data
      DEMO_MODE: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # The API proxies pages to the dev server instead of starting the built one ...
      WEB_UPSTREAM: http://127.0.0.1:3001
      WEB_PORT: '3001'
      # ... which reads the API over loopback.
      INTERNAL_API_URL: http://127.0.0.1:3000
    ports:
      - '127.0.0.1::3000'

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: darkbeacon
      POSTGRES_PASSWORD: darkbeacon
      POSTGRES_DB: darkbeacon
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U darkbeacon -d darkbeacon']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  node_modules:
  pnpm_store:
  data:
  postgres:
